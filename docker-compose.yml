# =============================================================================
# STORAGE STACK
#   SeaweedFS  : S3-compatible object storage (data lake / landing zone)
#   ClickHouse : OLAP warehouse, can read/write the lake over S3
# =============================================================================
name: storage

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE}
    container_name: seaweedfs
    restart: unless-stopped
    # All-in-one: master + volume + filer + S3 gateway in one process.
    # S3 credentials are written from .env at startup.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<JSON
        {"identities":[{"name":"platform",
          "credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],
          "actions":["Admin","Read","List","Tagging","Write"]}]}
        JSON
        exec weed server -ip=seaweedfs -ip.bind=0.0.0.0 -dir=/data \
          -master.volumeSizeLimitMB=1024 -volume.max=0 \
          -filer -s3 -s3.config=/etc/seaweedfs/s3.json -metricsPort=9324
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "${BIND_ADDRESS}:${SEAWEEDFS_S3_PORT}:8333"      # S3 API
      - "${BIND_ADDRESS}:${SEAWEEDFS_MASTER_PORT}:9333"  # master UI
      - "${BIND_ADDRESS}:${SEAWEEDFS_FILER_PORT}:8888"   # filer UI (browse files)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { cpus: "0.5", memory: 512m } } }
    logging: *logging

  # One-off: creates the buckets listed in S3_BUCKETS
  seaweedfs-init:
    image: ${SEAWEEDFS_IMAGE}
    container_name: seaweedfs-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for b in $$S3_BUCKETS; do
          echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333
        done
    environment:
      S3_BUCKETS: ${S3_BUCKETS}
    depends_on:
      seaweedfs: { condition: service_healthy }
    logging: *logging

  clickhouse:
    image: ${CLICKHOUSE_IMAGE}
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # used by config.d/platform.xml (from_env)
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    ports:
      - "${BIND_ADDRESS}:${CLICKHOUSE_HTTP_PORT}:8123"
      - "${BIND_ADDRESS}:${CLICKHOUSE_NATIVE_PORT}:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      seaweedfs: { condition: service_healthy }
    deploy: { resources: { limits: { cpus: "2.0", memory: 4g } } }
    logging: *logging

  oauth2-proxy:
      image: quay.io/oauth2-proxy/oauth2-proxy:latest
      container_name: oauth2-proxy-${SERVICE_NAME}
      command: --http-address=0.0.0.0:4180
      environment:
        OAUTH2_PROXY_PROVIDER: keycloak-oidc
        OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
        OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID}
        OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
        OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET}
        OAUTH2_PROXY_COOKIE_NAME: _oauth2_${SERVICE_NAME}
        OAUTH2_PROXY_EMAIL_DOMAINS: "*"
        OAUTH2_PROXY_UPSTREAMS: ${UPSTREAM_URL}
        OAUTH2_PROXY_REDIRECT_URL: ${REDIRECT_URL}
      ports: 
         - "${PROXY_PORT}:4180"

volumes:
  seaweedfs-data:
  clickhouse-data:

networks:
  default:
    name: data-platform
    external: true
